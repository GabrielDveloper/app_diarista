services:
  - type: web
    runtime: node
    name: sara-lima-api
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sara-lima-db
          property: connectionString
      - key: PUBLIC_SLUG
        value: sara-lima
      - key: PROFESSIONAL_NAME
        value: Sara Lima
      - key: PROFESSIONAL_SERVICE
        value: Empregada domestica e diarista

  - type: web
    runtime: static
    name: sara-lima-agenda
    buildCommand: echo "Using prebuilt Flutter Web"
    staticPublishPath: ./frontend/build/web

databases:
  - name: sara-lima-db
    databaseName: gestao_domestica
    user: gestao
    plan: free
    ipAllowList: []
